<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ufak Bir Hatıra</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #1f2833;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(69, 162, 158, 0.2);
      max-width: 400px;
      width: 100%;
      transition: all 0.5s ease;
    }
    img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 20px;
      display: none;
      box-shadow: 0 4px 20px rgba(102, 252, 241, 0.3);
      animation: fadeIn 1.5s ease-in-out;
    }
    .btn {
      background: #66fcf1;
      color: #0b0c10;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 252, 241, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #45a29e;
      color: #fff;
    }
    .msg {
      font-size: 18px;
      color: #c5c6c7;
      margin-top: 15px;
      display: none;
      animation: fadeIn 2s ease-in-out;
      line-height: 1.6;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="playBtn" class="btn" onclick="startSurprise()">Sürprizi Aç 🌸</button>
    
    <!-- Yüklediğin unutmabeni çiçeği resmi -->
    <img id="flowerImg" src="unutmabeni.jpg" alt="Unutmabeni Çiçeği">
    
    <!-- Gösterilecek mesaj -->
    <p id="msg" class="msg">Aklıma geldin, ufak bir şey paylaşmak istedim...</p>
  </div>

  <!-- Ses dosyası (1:10 saniyesinden başlar) -->
  <audio id="music" src="sarki.mp3#t=01:10" loop></audio>

  <script>
    function startSurprise() {
      // Butonu gizle, resmi ve mesajı göster
      document.getElementById('playBtn').style.display = 'none';
      document.getElementById('flowerImg').style.display = 'block';
      document.getElementById('msg').style.display = 'block';
      
      var audio = document.getElementById('music');
      
      // Tam 1 dakika 10 saniyeye (70. saniye) konumlandırıp çal
      audio.currentTime = 70; 
      audio.play();
    }
  </script>

</body>
</html>
